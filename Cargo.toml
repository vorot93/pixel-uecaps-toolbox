[package]
name = "pixel-uecaps-toolbox"
version = "1.0.0"
edition = "2024"
description = "Inspect, audit, and compile Google Pixel UE-capabilities (.binarypb) files"
authors = ["Artem Vorotnikov <artem@vorotnikov.me>"]
license = "Apache-2.0"
categories = ["command-line-utilities"]
keywords = ["pixel", "android", "protobuf", "uecaps", "modem"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
compact_str = "0.10"
csv = "1"
kdl = { version = "6", default-features = false, features = ["span"] }
num-integer = "0.1"
num-prime = "0.5"
pixel-bands = { git = "https://github.com/vorot93/pixel-bands", rev = "4e5408ce8aca2cdc9c1986530a5400f496eceea4" }
prost = "0.14"
tempfile = "3"
thiserror = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2.2.2"
rayon = "1"

[lints.clippy]
assert_is_empty = "warn"
format_push_string = "warn"
needless_pass_by_value = "warn"
ref_option = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"

[lints.rust]
unreachable_pub = "warn"
unsafe_code = "forbid"
